[package]
name = "coldlock"
version = "0.1.0"
edition = "2024"

[dependencies]
pam_unix = { version = "0.3.1", default-features = false, features = [
	"client",
] }
iced = { version = "0.14", default-features = false, features = [
	"advanced",
	"image",
	"smol",
	"wayland",
	"wgpu",
] }
iced_exwlshell = { version = "0.20", default-features = false, features = [
	"macros",
] }
uzers = "0.12.2"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
